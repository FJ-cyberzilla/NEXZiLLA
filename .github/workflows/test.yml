name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel
        # Install project dependencies first
        if [ -f requirements.txt ]; then
          pip install -r requirements.txt || echo "Requirements installation had issues, continuing..."
        fi
        # Install dev dependencies if they exist
        if [ -f requirements-dev.txt ]; then
          pip install -r requirements-dev.txt
        fi
        # Try to install project in editable mode
        if [ -f setup.py ] || [ -f pyproject.toml ]; then
          pip install -e ".[dev]" 2>/dev/null || pip install -e . 2>/dev/null || echo "Editable install failed, continuing..."
        fi
        # Ensure test dependencies are installed
        pip install pytest pytest-cov pylint
      continue-on-error: false
        
    - name: Verify installation
      run: |
        python --version
        pip list
        
    - name: Check syntax
      run: |
        if [ -f run_tests.py ]; then
          python run_tests.py --syntax-only
        else
          echo "run_tests.py not found, skipping syntax check"
          # Alternative: check syntax with py_compile
          python -m py_compile main/**/*.py 2>/dev/null || python -m py_compile main/*.py 2>/dev/null || echo "No Python files found to check"
        fi
      continue-on-error: true
      
    - name: Run tests with pytest
      run: |
        if [ -f run_tests.py ]; then
          python run_tests.py
        elif [ -d tests ]; then
          pytest tests/ --cov=main --cov-report=xml --cov-report=term-missing
        else
          echo "No tests found, skipping test execution"
        fi
      continue-on-error: false
      
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true
