name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel build
        
        # Install the package in editable mode with dev dependencies
        pip install -e ".[dev]"
        
    - name: Verify installation
      run: |
        python -c "import cyber_intel_sdk; print(f'✅ cyber_intel_sdk {cyber_intel_sdk.__version__} installed successfully')" || echo "⚠️ cyber_intel_sdk import failed"
        echo "📦 Installed packages:"
        pip list
        
    - name: Lint with flake8
      run: |
        flake8 cyber_intel_sdk main --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 cyber_intel_sdk main --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics || true
      continue-on-error: true
      
    - name: Check syntax
      run: |
        if [ -f run_tests.py ]; then
          python run_tests.py --syntax-only
        fi
      continue-on-error: true
      
    - name: Run tests with pytest
      run: |
        if [ -f run_tests.py ]; then
          python run_tests.py
        else
          pytest
        fi
      
    - name: Upload coverage to Codecov
      if: always()
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
      continue-on-error: true
